f" style="animation:tw 3.2s ease-in-out 0.3s infinite"/><circle cx="1157.6" cy="293.8" r="1.4" fill="#fff" style="animation:tw 1.6s ease-in-out 1.1s infinite"/><circle cx="308.8" cy="280.7" r="1.5" fill="#fff" style="animation:tw 3.8s ease-in-out 0.7s infinite"/><circle cx="512.9" cy="180.9" r="0.5" fill="#fff" style="animation:tw 3.3s ease-in-out 1.9s infinite"/><circle cx="523.4" cy="337.4" r="0.9" fill="#fff" style="animation:tw 2.2s ease-in-out 1.3s infinite"/><circle cx="543.4" cy="56.2" r="0.7" fill="#fff" style="animation:tw 3.4s ease-in-out 1.2s infinite"/><circle cx="500.3" cy="131.2" r="0.5" fill="#fff" style="animation:tw 3.6s ease-in-out 1.5s infinite"/><circle cx="817.7" cy="300.1" r="1.5" fill="#fff" style="animation:tw 3.3s ease-in-out 1.8s infinite"/><circle cx="155.4" cy="190.7" r="1.3" fill="#fff" style="animation:tw 1.6s ease-in-out 0.8s infinite"/><circle cx="1064.8" cy="213.6" r="1.3" fill="#fff" style="animation:tw 3s ease-in-out 0.1s infinite"/><circle cx="417.5" cy="310.2" r="0.6" fill="#fff" style="animation:tw 2.3s ease-in-out 1.5s infinite"/><circle cx="955.7" cy="343" r="1.4" fill="#fff" style="animation:tw 3.6s ease-in-out 0.1s infinite"/><circle cx="24.4" cy="257.8" r="1.2" fill="#fff" style="animation:tw 2.3s ease-in-out 1s infinite"/><circle cx="341.6" cy="152" r="1" fill="#fff" style="animation:tw 3.3s ease-in-out 0.2s infinite"/><circle cx="146.4" cy="34.7" r="0.9" fill="#fff" style="animation:tw 3.3s ease-in-out 1.3s infinite"/><circle cx="1067.7" cy="18.4" r="1.1" fill="#fff" style="animation:tw 2.9s ease-in-out 1s infinite"/><circle cx="269.6" cy="110.5" r="0.7" fill="#fff" style="animation:tw 3.8s ease-in-out 1.5s infinite"/><circle cx="94.4" cy="339.5" r="1.2" fill="#fff" style="animation:tw 1.8s ease-in-out 0.4s infinite"/><circle cx="707.9" cy="200.2" r="0.8" fill="#fff" style="animation:tw 2.9s ease-in-out 0.4s infinite"/><circle cx="937.1" cy="185.9" r="1.4" fill="#fff" style="animation:tw 3.7s ease-in-out 1.5s infinite"/><