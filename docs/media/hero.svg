<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Vakti — showcase of the offline tip-card app">
<style>
.bg{animation:bg 12s linear infinite}
@keyframes bg{0%,8%{fill:#f7efe1}28%{fill:#7a4a22}48%,80%{fill:#14100b}90%,100%{fill:#f7efe1}}
.ink{animation:ink 12s linear infinite}
@keyframes ink{0%,17.5%{fill:#2b2015}18.5%,28%{fill:#fff5e6}48%,84.5%{fill:#f9eedc}85.5%,100%{fill:#2b2015}}
.rule{animation:rule 12s linear infinite}
@keyframes rule{0%,17.5%{stroke:#2b201533}18.5%,28%{stroke:#fff5e633}48%,84.5%{stroke:#f9eedc33}85.5%,100%{stroke:#2b201533}}
.muted{opacity:.74}
.stars{animation:stars 12s linear infinite}
@keyframes stars{0%,8%{opacity:0}28%{opacity:.2}48%,80%{opacity:.85}90%,100%{opacity:0}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.bezel{animation:bezel 12s linear infinite}
@keyframes bezel{0%,8%{fill:#fffaf6}28%{fill:#5a2c45}48%,80%{fill:#20121b}90%,100%{fill:#fffaf6}}
.scr{animation:scr 12s linear infinite}
@keyframes scr{0%,8%{fill:#fff3ee}28%{fill:#3a1b2c}48%,80%{fill:#140a12}90%,100%{fill:#fff3ee}}
.rowbg{animation:rowbg 12s linear infinite}
@keyframes rowbg{0%,8%{fill:#2a142010}28%{fill:#fff0f512}48%,80%{fill:#ffffff0c}90%,100%{fill:#2a142010}}
.pill{animation:pill 12s linear infinite}
@keyframes pill{0%,8%{fill:#2a14200d}28%{fill:#fff0f51a}48%,80%{fill:#ffffff12}90%,100%{fill:#2a14200d}}
.toast{animation:toast 12s linear infinite}
@keyframes toast{0%,8%{fill:#ffffff}28%{fill:#4a2238}48%,80%{fill:#26121e}90%,100%{fill:#ffffff}}
.edge{animation:edge 12s linear infinite}
@keyframes edge{0%,8%{stroke:#2a142024}28%{stroke:#fff0f526}48%,80%{stroke:#ffffff1f}90%,100%{stroke:#2a142024}}
.shade{animation:shade 12s linear infinite}
@keyframes shade{0%,8%{fill-opacity:.10}28%{fill-opacity:.22}48%,80%{fill-opacity:.45}90%,100%{fill-opacity:.10}}
.lit{filter:drop-shadow(0 0 3px currentColor)}
.caret{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.ping{animation:ping 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.arc{stroke-dasharray:190;animation:arc 12s ease-in-out infinite}
@keyframes arc{0%{stroke-dashoffset:190}5%{stroke-dashoffset:190}20%{stroke-dashoffset:40}93.3%{stroke-dashoffset:40}97.5%{stroke-dashoffset:190}100%{stroke-dashoffset:190}}
@keyframes front{0%{opacity:0}0%{opacity:0}2.5%{opacity:1}45%{opacity:1}47.5%{opacity:0}100%{opacity:0}}
@keyframes back{0%{opacity:0}45%{opacity:0}47.5%{opacity:1}95%{opacity:1}97.5%{opacity:0}100%{opacity:0}}
@keyframes sk0{0%{opacity:0}0%{opacity:0}1.3%{opacity:1}30%{opacity:1}31.3%{opacity:0}100%{opacity:0}}
@keyframes sk1{0%{opacity:0}30%{opacity:0}31.3%{opacity:1}96.7%{opacity:1}97.9%{opacity:0}100%{opacity:0}}
.share{animation:share 12s cubic-bezier(.3,1.3,.5,1) infinite}
@keyframes share{0%{opacity:0;transform:translateY(-14px)}71.7%{opacity:0;transform:translateY(-14px)}74.6%{opacity:1;transform:none}93.3%{opacity:1;transform:none}96.2%{opacity:0;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
